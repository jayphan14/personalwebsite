<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <rect width="720" height="360" fill="#ffffff"/>

  <text x="360" y="26" text-anchor="middle" font-size="13" font-weight="600" fill="#333">Order book latency, three implementations</text>

  <!-- axes -->
  <line x1="60" y1="290" x2="690" y2="290" stroke="#444" stroke-width="1.3"/>
  <line x1="60" y1="290" x2="60" y2="50" stroke="#444" stroke-width="1.3"/>

  <!-- grid -->
  <g stroke="#eee" stroke-width="1">
    <line x1="60" y1="100" x2="690" y2="100"/>
    <line x1="60" y1="160" x2="690" y2="160"/>
    <line x1="60" y1="220" x2="690" y2="220"/>
    <line x1="180" y1="50" x2="180" y2="290"/>
    <line x1="300" y1="50" x2="300" y2="290"/>
    <line x1="420" y1="50" x2="420" y2="290"/>
    <line x1="540" y1="50" x2="540" y2="290"/>
  </g>

  <!-- x ticks (latency) -->
  <g font-size="11" fill="#666" text-anchor="middle">
    <text x="60" y="306">0</text>
    <text x="180" y="306">100 ns</text>
    <text x="300" y="306">300 ns</text>
    <text x="420" y="306">1 µs</text>
    <text x="540" y="306">3 µs</text>
    <text x="660" y="306">10 µs</text>
  </g>

  <!-- y label -->
  <text x="22" y="170" text-anchor="middle" font-size="12" fill="#555" transform="rotate(-90 22 170)">density</text>
  <text x="375" y="332" text-anchor="middle" font-size="12" fill="#555">latency (log scale)</text>

  <!-- std::map (red): bimodal, peak around hashmap-only at left, peak around binary-search at middle, fat tail -->
  <g fill="none" stroke="#d4506b" stroke-width="2">
    <path d="M 60 290
             Q 110 250, 130 130
             Q 150 250, 200 280
             Q 260 270, 310 170
             Q 360 270, 430 250
             Q 530 240, 660 232" />
  </g>

  <!-- std::vector forward (orange): single peak around mid, big fat tail -->
  <g fill="none" stroke="#c47a2b" stroke-width="2">
    <path d="M 60 290
             Q 200 286, 280 200
             Q 320 130, 360 150
             Q 420 240, 500 248
             Q 580 252, 660 244" />
  </g>

  <!-- std::vector reversed (green): tight narrow peak, no tail -->
  <g fill="none" stroke="#0b6d5a" stroke-width="2.2">
    <path d="M 60 290
             Q 220 290, 290 240
             Q 320 70, 350 240
             Q 400 290, 660 290" />
  </g>

  <!-- legend -->
  <g font-size="12" fill="#444">
    <rect x="465" y="58" width="220" height="78" fill="#fafaf7" stroke="#ddd" stroke-width="1"/>
    <line x1="478" y1="76" x2="510" y2="76" stroke="#d4506b" stroke-width="2"/>
    <text x="518" y="80">std::map (bimodal, fat tail)</text>
    <line x1="478" y1="98" x2="510" y2="98" stroke="#c47a2b" stroke-width="2"/>
    <text x="518" y="102">std::vector, forward (tail)</text>
    <line x1="478" y1="120" x2="510" y2="120" stroke="#0b6d5a" stroke-width="2.2"/>
    <text x="518" y="124">std::vector, reversed</text>
  </g>

  <text x="375" y="350" text-anchor="middle" font-size="11" fill="#666">reproduced from David Gross, "When Nanoseconds Matter" (CppCon 2024). Shapes are illustrative.</text>
</svg>
