<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="100%" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <rect width="760" height="240" fill="#ffffff"/>

  <text x="380" y="24" text-anchor="middle" font-size="13" font-weight="600" fill="#333">WLP4 to MIPS: a four-stage pipeline of stdin/stdout filters</text>

  <!-- Six artefacts as rounded boxes, 5 transforms as labelled arrows -->
  <g font-size="12">
    <rect x="20"  y="80" width="100" height="48" rx="6" fill="#fafaf7" stroke="#0b6d5a" stroke-width="1.4"/>
    <text x="70"  y="100" text-anchor="middle" font-weight="600" fill="#0b6d5a">Source</text>
    <text x="70"  y="116" text-anchor="middle" font-size="10" fill="#666">.wlp4 text</text>

    <rect x="148" y="80" width="100" height="48" rx="6" fill="#fafaf7" stroke="#0b6d5a" stroke-width="1.4"/>
    <text x="198" y="100" text-anchor="middle" font-weight="600" fill="#0b6d5a">Tokens</text>
    <text x="198" y="116" text-anchor="middle" font-size="10" fill="#666">stream</text>

    <rect x="276" y="80" width="100" height="48" rx="6" fill="#fafaf7" stroke="#0b6d5a" stroke-width="1.4"/>
    <text x="326" y="100" text-anchor="middle" font-weight="600" fill="#0b6d5a">Parse tree</text>
    <text x="326" y="116" text-anchor="middle" font-size="10" fill="#666">untyped</text>

    <rect x="404" y="80" width="100" height="48" rx="6" fill="#fafaf7" stroke="#0b6d5a" stroke-width="1.4"/>
    <text x="454" y="100" text-anchor="middle" font-weight="600" fill="#0b6d5a">Typed tree</text>
    <text x="454" y="116" text-anchor="middle" font-size="10" fill="#666">decorated</text>

    <rect x="532" y="80" width="100" height="48" rx="6" fill="#fafaf7" stroke="#0b6d5a" stroke-width="1.4"/>
    <text x="582" y="100" text-anchor="middle" font-weight="600" fill="#0b6d5a">Assembly</text>
    <text x="582" y="116" text-anchor="middle" font-size="10" fill="#666">.asm text</text>

    <rect x="660" y="80" width="80" height="48" rx="6" fill="#fafaf7" stroke="#d4506b" stroke-width="1.4"/>
    <text x="700" y="100" text-anchor="middle" font-weight="600" fill="#d4506b">MIPS</text>
    <text x="700" y="116" text-anchor="middle" font-size="10" fill="#666">runs on sim</text>
  </g>

  <defs>
    <marker id="arrCmp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <g font-size="10" fill="#666">
    <line x1="120" y1="104" x2="146" y2="104" stroke="#888" stroke-width="1.5" marker-end="url(#arrCmp)"/>
    <text x="133" y="76" text-anchor="middle">scanner</text>

    <line x1="248" y1="104" x2="274" y2="104" stroke="#888" stroke-width="1.5" marker-end="url(#arrCmp)"/>
    <text x="261" y="76" text-anchor="middle">parser</text>

    <line x1="376" y1="104" x2="402" y2="104" stroke="#888" stroke-width="1.5" marker-end="url(#arrCmp)"/>
    <text x="389" y="76" text-anchor="middle">typecheck</text>

    <line x1="504" y1="104" x2="530" y2="104" stroke="#888" stroke-width="1.5" marker-end="url(#arrCmp)"/>
    <text x="517" y="76" text-anchor="middle">codegen</text>

    <line x1="632" y1="104" x2="658" y2="104" stroke="#888" stroke-width="1.5" marker-end="url(#arrCmp)"/>
    <text x="645" y="76" text-anchor="middle">cs241 linker</text>
  </g>

  <text x="380" y="170" text-anchor="middle" font-size="11" fill="#666">each stage is its own binary, reading stdin and writing stdout</text>
  <text x="380" y="190" text-anchor="middle" font-size="11" fill="#666">no shared in-memory IR; the disk text between stages is the contract</text>
  <text x="380" y="214" text-anchor="middle" font-size="10" fill="#888">small enough to read end to end, faithful enough to feel like a real compiler</text>
</svg>
