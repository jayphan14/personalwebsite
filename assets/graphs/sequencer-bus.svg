<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <rect width="720" height="340" fill="#ffffff"/>

  <text x="360" y="24" text-anchor="middle" font-size="13" font-weight="600" fill="#333">A sequencer: shared-memory MPMC ring with monotonic sequence numbers</text>

  <!-- Producer apps -->
  <g>
    <rect x="40" y="68" width="130" height="38" rx="4" fill="#fafaf7" stroke="#0b6d5a" stroke-width="1.4"/>
    <text x="105" y="92" text-anchor="middle" font-size="12" fill="#333">App A (publish)</text>

    <rect x="40" y="148" width="130" height="38" rx="4" fill="#fafaf7" stroke="#0b6d5a" stroke-width="1.4"/>
    <text x="105" y="172" text-anchor="middle" font-size="12" fill="#333">App B (publish)</text>

    <rect x="40" y="228" width="130" height="38" rx="4" fill="#fafaf7" stroke="#0b6d5a" stroke-width="1.4"/>
    <text x="105" y="252" text-anchor="middle" font-size="12" fill="#333">App C (publish)</text>
  </g>

  <!-- Ring buffer container -->
  <g>
    <rect x="210" y="118" width="300" height="100" rx="6" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
    <text x="360" y="138" text-anchor="middle" font-size="12" font-weight="600" fill="#333">Shared-memory ring</text>

    <!-- Slot cells (4 written + 3 empty) -->
    <rect x="226" y="156" width="40" height="36" fill="#0b6d5a" stroke="#444"/>
    <text x="246" y="172" text-anchor="middle" font-size="10" fill="#fff">N</text>
    <text x="246" y="186" text-anchor="middle" font-size="9" fill="#fff">payload</text>

    <rect x="266" y="156" width="40" height="36" fill="#0b6d5a" stroke="#444"/>
    <text x="286" y="172" text-anchor="middle" font-size="10" fill="#fff">N+1</text>
    <text x="286" y="186" text-anchor="middle" font-size="9" fill="#fff">payload</text>

    <rect x="306" y="156" width="40" height="36" fill="#0b6d5a" stroke="#444"/>
    <text x="326" y="172" text-anchor="middle" font-size="10" fill="#fff">N+2</text>
    <text x="326" y="186" text-anchor="middle" font-size="9" fill="#fff">payload</text>

    <rect x="346" y="156" width="40" height="36" fill="#0b6d5a" stroke="#444"/>
    <text x="366" y="172" text-anchor="middle" font-size="10" fill="#fff">N+3</text>
    <text x="366" y="186" text-anchor="middle" font-size="9" fill="#fff">payload</text>

    <rect x="386" y="156" width="40" height="36" fill="#fafaf7" stroke="#444"/>
    <text x="406" y="178" text-anchor="middle" font-size="10" fill="#999">empty</text>

    <rect x="426" y="156" width="40" height="36" fill="#fafaf7" stroke="#444"/>
    <text x="446" y="178" text-anchor="middle" font-size="10" fill="#999">empty</text>

    <rect x="466" y="156" width="40" height="36" fill="#fafaf7" stroke="#444"/>
    <text x="486" y="178" text-anchor="middle" font-size="10" fill="#999">empty</text>

    <text x="360" y="208" text-anchor="middle" font-size="10" fill="#666">monotonic seq numbers, atomic write index, per-subscriber read index</text>
  </g>

  <!-- Consumer apps -->
  <g>
    <rect x="550" y="68" width="130" height="38" rx="4" fill="#fafaf7" stroke="#d4506b" stroke-width="1.4"/>
    <text x="615" y="92" text-anchor="middle" font-size="12" fill="#333">App D (subscribe)</text>

    <rect x="550" y="148" width="130" height="38" rx="4" fill="#fafaf7" stroke="#d4506b" stroke-width="1.4"/>
    <text x="615" y="172" text-anchor="middle" font-size="12" fill="#333">App E (subscribe)</text>

    <rect x="550" y="228" width="130" height="38" rx="4" fill="#fafaf7" stroke="#d4506b" stroke-width="1.4"/>
    <text x="615" y="252" text-anchor="middle" font-size="12" fill="#333">App F (subscribe)</text>
  </g>

  <!-- arrow defs -->
  <defs>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b6d5a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d4506b"/>
    </marker>
  </defs>

  <!-- Producer arrows -->
  <line x1="170" y1="87"  x2="208" y2="148" stroke="#0b6d5a" stroke-width="1.5" marker-end="url(#arrG)"/>
  <line x1="170" y1="167" x2="208" y2="167" stroke="#0b6d5a" stroke-width="1.5" marker-end="url(#arrG)"/>
  <line x1="170" y1="247" x2="208" y2="186" stroke="#0b6d5a" stroke-width="1.5" marker-end="url(#arrG)"/>

  <!-- Consumer arrows -->
  <line x1="510" y1="148" x2="548" y2="87"  stroke="#d4506b" stroke-width="1.5" marker-end="url(#arrR)"/>
  <line x1="510" y1="167" x2="548" y2="167" stroke="#d4506b" stroke-width="1.5" marker-end="url(#arrR)"/>
  <line x1="510" y1="186" x2="548" y2="247" stroke="#d4506b" stroke-width="1.5" marker-end="url(#arrR)"/>

  <!-- caption -->
  <text x="360" y="298" text-anchor="middle" font-size="11" fill="#666">in a real sequencer, every app is usually both publisher and subscriber</text>
  <text x="360" y="316" text-anchor="middle" font-size="11" fill="#666">sequence numbers are the contract that defines order across all producers</text>
</svg>
